<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EPI QUEST — Public Health Training Arcade</title><meta name="theme-color" content="#120428">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--bg:#120428;--bg2:#1d0b3d;--ink:#fff;--muted:#c9b8ff;--pink:#ff2e88;--cyan:#00e5ff;--lime:#b6ff00;--orange:#ff8a00;--yellow:#ffe600;--violet:#7c4dff;--red:#ff3b3b;--mint:#00ffa3;--card:#24104a;--line:#000;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:17px;line-height:1.45;min-height:100%}
body{overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Bungee',Impact,sans-serif;font-weight:400;letter-spacing:.5px}
a{color:var(--cyan)}
button{font-family:inherit;cursor:pointer}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bug{position:absolute;opacity:.16;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(360deg)}}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px 14px 110px}
header.top{display:flex;align-items:center;gap:12px;padding:10px 0 14px;flex-wrap:wrap}
.logo{font-family:'Bungee Shade','Bungee',sans-serif;font-size:30px;line-height:1;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;animation:hue 8s linear infinite}
@keyframes hue{50%{filter:hue-rotate(90deg)}}
.xpbox{flex:1;min-width:200px;display:flex;align-items:center;gap:10px}
.lvl{background:var(--yellow);color:#000;font-family:'Bungee';border:3px solid #000;border-radius:12px;padding:2px 10px;box-shadow:3px 3px 0 #000;white-space:nowrap}
.xpbar{flex:1;height:18px;border:3px solid #000;border-radius:20px;background:#0b021c;overflow:hidden;box-shadow:3px 3px 0 #000}
.xpfill{height:100%;background:repeating-linear-gradient(45deg,var(--lime),var(--lime) 10px,var(--mint) 10px,var(--mint) 20px);background-size:28px 28px;animation:stripes 1s linear infinite;transition:width .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes stripes{to{background-position:28px 0}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:3px solid #000;border-radius:14px;padding:4px 10px;box-shadow:3px 3px 0 #000;font-weight:700;white-space:nowrap}
.iconbtn{background:var(--violet);color:#fff;border:3px solid #000;border-radius:14px;padding:5px 10px;box-shadow:3px 3px 0 #000;font-size:18px}
.iconbtn:active,.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;background:#0b021c;border-top:4px solid #000;padding:8px 6px calc(8px + env(safe-area-inset-bottom));overflow-x:auto}
nav.tabs button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;min-width:62px}
nav.tabs button span{font-size:24px;transition:transform .2s}
nav.tabs button.on{background:var(--pink);color:#fff;box-shadow:inset 0 0 0 3px #000}
nav.tabs button.on span{transform:scale(1.2) rotate(-8deg)}
.page{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:6px 0 4px}
.sub{color:var(--muted);margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:4px solid #000;border-radius:20px;padding:16px;box-shadow:6px 6px 0 #000;position:relative}
.card.click{cursor:pointer;transition:transform .15s}
.card.click:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:9px 9px 0 #000}
.card h3{font-size:20px;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:800;color:#000;background:var(--cyan);border:2px solid #000;border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid #000;border-radius:16px;padding:10px 18px;font-weight:800;font-size:17px;box-shadow:4px 4px 0 #000;background:var(--yellow);color:#000;transition:transform .1s}
.btn:hover{transform:translate(-1px,-2px)}
.btn.pink{background:var(--pink);color:#fff}.btn.cyan{background:var(--cyan)}.btn.lime{background:var(--lime)}.btn.violet{background:var(--violet);color:#fff}.btn.ghost{background:var(--bg2);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;border-width:3px;box-shadow:3px 3px 0 #000}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{background:linear-gradient(135deg,var(--pink),var(--violet));border:4px solid #000;border-radius:26px;box-shadow:8px 8px 0 #000;padding:22px;margin-bottom:20px;position:relative;overflow:hidden}
.hero .big{font-family:'Bungee';font-size:clamp(26px,5vw,40px);line-height:1.05}
.hero .bigemoji{position:absolute;right:10px;top:-6px;font-size:110px;opacity:.35;animation:wob 4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(14deg) scale(1.08)}}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #ffffff22}
.quest .ck{width:28px;height:28px;border:3px solid #000;border-radius:8px;background:#0b021c;display:grid;place-items:center;font-weight:900}
.quest.done .ck{background:var(--lime);color:#000}
.quest.done .qt{text-decoration:line-through;opacity:.6}
.mini{font-size:13px;color:var(--muted)}
.sec{font-size:24px;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--pink) 0 14px,transparent 14px 22px)}
.list li{margin:4px 0 4px 20px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#0b021c;border:3px solid #000;border-radius:16px;padding:10px;text-align:center}
.stat .n{font-family:'Bungee';font-size:28px}
.trend{font-weight:800;font-size:13px}
.newsitem{display:block;padding:10px 12px;margin:8px 0;background:#0b021c;border:3px solid #000;border-radius:14px;text-decoration:none;color:#fff;transition:transform .15s}
.newsitem:hover{transform:translateX(6px);border-color:var(--cyan)}
.newsitem.hot{border-color:var(--red);box-shadow:0 0 0 2px var(--red),0 0 18px #ff3b3b66}
.newsitem .d{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:3px solid #000;border-radius:14px;overflow:hidden;box-shadow:3px 3px 0 #000;flex-wrap:wrap}
.seg button{border:none;background:var(--bg2);color:#fff;padding:7px 12px;font-weight:800}
.seg button.on{background:var(--cyan);color:#000}
/* modal / game */
#modal{position:fixed;inset:0;z-index:50;background:#08011acc;backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
#modal.on{display:flex}
#modal .box{width:100%;max-width:780px;background:var(--bg2);border:5px solid #000;border-radius:26px;box-shadow:10px 10px 0 #000;padding:20px;margin:auto;animation:pop .3s cubic-bezier(.3,1.6,.5,1);position:relative}
.close{position:absolute;right:12px;top:12px;background:var(--red);color:#fff;border:3px solid #000;border-radius:12px;width:40px;height:40px;font-size:20px;font-weight:900;box-shadow:3px 3px 0 #000;z-index:2}
.gamehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 46px 14px 0}
.qcard{background:#fff;color:#14062d;border:4px solid #000;border-radius:20px;padding:20px;font-size:20px;font-weight:600;box-shadow:6px 6px 0 #000;margin-bottom:16px;min-height:90px;animation:pop .3s}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.opt{border:4px solid #000;border-radius:16px;padding:14px;font-weight:800;font-size:16px;background:var(--cyan);color:#000;box-shadow:4px 4px 0 #000;transition:transform .1s}
.opt:nth-child(5n+2){background:var(--yellow)}.opt:nth-child(5n+3){background:var(--lime)}.opt:nth-child(5n+4){background:var(--orange)}.opt:nth-child(5n+5){background:#ff9bd2}
.opt:hover{transform:translateY(-3px) rotate(-1deg)}
.opt.right{background:var(--mint)!important;animation:bounce .4s}
.opt.wrong{background:var(--red)!important;color:#fff;animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes bounce{40%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{margin-top:14px;padding:12px 14px;border:3px solid #000;border-radius:14px;background:#0b021c;animation:pop .3s}
.timer{height:14px;border:3px solid #000;border-radius:10px;background:#0b021c;overflow:hidden;flex:1;min-width:120px}
.timer div{height:100%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--lime));transition:width 1s linear}
.combo{font-family:'Bungee';color:var(--yellow);animation:wob 1s infinite}
.score{font-family:'Bungee';font-size:22px}
input,select,textarea{font-family:inherit;font-size:16px;border:3px solid #000;border-radius:12px;padding:8px 10px;background:#fff;color:#000}
.calc label{display:block;font-size:13px;font-weight:700;margin-top:8px;color:var(--muted)}
.calc input{width:100%}
.result{font-family:'Bungee';font-size:26px;color:var(--lime);margin-top:10px}
.formula{font-family:'Courier New',monospace;font-weight:800;background:#000;color:var(--yellow);padding:6px 10px;border-radius:10px;display:inline-block;margin:4px 0}
.flip{perspective:900px;cursor:pointer;height:120px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border:4px solid #000;border-radius:16px;display:grid;place-items:center;text-align:center;padding:8px;font-weight:800;box-shadow:4px 4px 0 #000}
.flip .f{background:var(--violet);font-size:30px}
.flip .b{background:#fff;color:#000;transform:rotateY(180deg);font-size:14px}
.flip.gone .b{background:var(--lime)}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.memgrid{grid-template-columns:repeat(3,1fr)}.flip{height:110px}.flip .b{font-size:12px}.statgrid{grid-template-columns:1fr 1fr 1fr}.logo{font-size:24px}nav.tabs{justify-content:space-between;gap:0}nav.tabs button{min-width:0;flex:1;padding:4px 2px;font-size:10px}nav.tabs button span{font-size:20px}}
canvas{max-width:100%;display:block}
.simwrap{background:#0b021c;border:4px solid #000;border-radius:18px;overflow:hidden}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:13px;font-weight:700}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #000}
.epibars{display:flex;align-items:flex-end;gap:3px;height:160px;padding:8px;background:#0b021c;border:3px solid #000;border-radius:14px}
.epibars div{flex:1;background:var(--pink);border:2px solid #000;border-bottom:none;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes grow{from{transform:scaleY(0)}}
table.t{border-collapse:collapse;width:100%;background:#fff;color:#000;border:3px solid #000;border-radius:12px;overflow:hidden;font-size:15px}
table.t th,table.t td{border:2px solid #000;padding:6px 8px;text-align:center}
table.t th{background:var(--yellow)}
table.t tr.pick{background:#d9ffe9}
.wheelwrap{position:relative;width:min(340px,86vw);margin:10px auto}
.wheelwrap .pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:36px;z-index:2;filter:drop-shadow(2px 2px 0 #000)}
#wheel{transition:transform 4s cubic-bezier(.15,.9,.2,1);border-radius:50%;border:5px solid #000;box-shadow:6px 6px 0 #000}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:90;background:var(--yellow);color:#000;font-weight:900;border:4px solid #000;border-radius:16px;padding:10px 18px;box-shadow:5px 5px 0 #000;animation:toast 2.6s forwards;pointer-events:none;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
.xpfloat{position:fixed;z-index:95;font-family:'Bungee';color:var(--lime);font-size:26px;pointer-events:none;text-shadow:3px 3px 0 #000;animation:up 1.1s forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.badge{text-align:center;padding:10px;border:3px solid #000;border-radius:16px;background:#0b021c}
.badge.off{filter:grayscale(1);opacity:.35}
.badge .e{font-size:36px}
.dz{font-size:44px;line-height:1}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:2px solid #000;font-weight:800;font-size:13px}
.status-Interested{background:var(--cyan);color:#000}.status-Studying{background:var(--yellow);color:#000}.status-Applied{background:var(--orange);color:#000}.status-Done{background:var(--lime);color:#000}.status-None{background:#444;color:#fff}
.focusring{font-family:'Bungee';font-size:13px}
.meter{height:22px;border:3px solid #000;border-radius:12px;background:#0b021c;overflow:hidden}
.meter div{height:100%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--lime));transition:width .6s}
.boredbtn{position:fixed;right:16px;bottom:96px;z-index:30;background:var(--orange);color:#000;font-family:'Bungee';border:4px solid #000;border-radius:999px;padding:12px 16px;box-shadow:5px 5px 0 #000;animation:wob 3s ease-in-out infinite}
.boredbtn:hover{animation-play-state:paused}
details{background:#0b021c;border:3px solid #000;border-radius:14px;padding:10px 12px;margin:8px 0}
summary{font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="bgfx"></div><canvas id="confetti"></canvas>
<div id="app"><header class="top" id="hdr"></header><main id="main"></main></div>
<button class="boredbtn" onclick="startGame(pick(GAMES).id)" title="Jump to a random game">😩 I'm bored</button>

 {id:"ar", cat:"Epi", name:"Attack Rate (Incidence Proportion)", f:"new cases ÷ population at risk × 100", ins:[["New cases",30],["Population at risk",120]], calc:v=>v[0]/v[1]*100, unit:"%", tip:"Used in outbreaks. It's really a proportion, not a rate."},

 {id:"rr", cat:"2×2 Table", name:"Risk Ratio (Relative Risk)", f:"[a ÷ (a+b)] ÷ [c ÷ (c+d)]", ins:[["a: exposed & sick",40],["b: exposed & well",60],["c: unexposed & sick",10],["d: unexposed & well",90]], calc:v=>(v[0]/(v[0]+v[1]))/(v[2]/(v[2]+v[3])), unit:"", tip:"Cohort studies. RR = 1 no association; >1 higher risk; <1 protective."},
 {id:"or", cat:"2×2 Table", name:"Odds Ratio", f:"(a × d) ÷ (b × c)", ins:[["a: cases exposed",30],["b: controls exposed",15],["c: cases unexposed",20],["d: controls unexposed",35]], calc:v=>(v[0]*v[3])/(v[1]*v[2]), unit:"", tip:"Case-control studies. Cross-multiply: ad over bc."},

 {id:"arp", cat:"2×2 Table", name:"Attributable Risk %", f:"(Re − Ru) ÷ Re × 100", ins:[["Risk exposed (%)",40],["Risk unexposed (%)",10]], calc:v=>(v[0]-v[1])/v[0]*100, unit:"%", tip:"Share of exposed people's disease that's due to the exposure."},
 {id:"par", cat:"2×2 Table", name:"Population Attributable Risk %", f:"(R total − R unexposed) ÷ R total × 100", ins:[["Risk in total pop (%)",18],["Risk unexposed (%)",10]], calc:v=>(v[0]-v[1])/v[0]*100, unit:"%", tip:"How much disease in the WHOLE community you'd prevent by removing the exposure. Great for program planning pitches."},

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

S.settings=Object.assign({},DEF.settings,S.settings);

function touchDay(){const t=today();if(S.lastDay===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=t;S.day={date:t,games:0,correct:0,formula:0,myth:0,read:0};if(S.streak>=3)badge("streak3");save()}

/* levels: level L needs 150*L*(L+1)/2 xp */
const need=l=>75*l*(l+1);
function levelOf(xp){let l=0;while(xp>=need(l+1))l++;return l}
function addXP(n,el){const before=levelOf(S.xp);S.xp+=n;save();renderHeader();
 const f=document.createElement("div");f.className="xpfloat";f.textContent="+"+n+" XP";
 const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2};
 f.style.left=(r.left+(r.width||0)/2-40)+"px";f.style.top=(r.top)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1100);
 const after=levelOf(S.xp);if(after>before){sfx("level");confetti(160);toast("LEVEL UP! You're now a "+LEVELS[Math.min(after,LEVELS.length-1)]+" 🎉")}}
function badge(id){if(S.badges.includes(id))return;S.badges.push(id);save();const b=BADGES[id];setTimeout(()=>{toast(b[0]+" Badge unlocked: "+b[1]);sfx("level");confetti(80)},400)}

/* sound */
let AC;function sfx(t){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq={right:[[660,.07],[880,.1]],wrong:[[220,.18]],level:[[523,.08],[659,.08],[784,.08],[1046,.2]],click:[[440,.03]],tick:[[1200,.02]]}[t]||[[440,.05]];let tt=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t==="wrong"?"sawtooth":"square";o.frequency.value=f;g.gain.setValueAtTime(.08,tt);g.gain.exponentialRampToValueAtTime(.001,tt+d);o.connect(g);g.connect(AC.destination);o.start(tt);o.stop(tt+d);tt+=d})}catch(e){}}

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}

/* confetti */
let cParts=[],cRun=false;
function confetti(n=120){const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#ff2e88","#00e5ff","#b6ff00","#ffe600","#ff8a00","#7c4dff"];
 for(let i=0;i<n;i++)cParts.push({x:innerWidth/2+rnd(-80,80),y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,s:rnd(6,12),c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,l:120});
 if(cRun)return;cRun=true;(function loop(){x.clearRect(0,0,c.width,c.height);cParts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.r+=p.vr;p.l--;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});cParts=cParts.filter(p=>p.l>0&&p.y<c.height+20);if(cParts.length)requestAnimationFrame(loop);else{cRun=false;x.clearRect(0,0,c.width,c.height)}})()}

let focusEnd=0,focusInt;

function openWheel(){const items=shuffle(GAMES).slice(0,8);const cols=["#ff2e88","#00e5ff","#b6ff00","#ffe600","#ff8a00","#7c4dff","#00ffa3","#ff3b3b"];
 modal(`<h2 style="text-align:center">🎡 Spin the Wheel</h2><p class="sub" style="text-align:center">Let fate pick your next game.</p><div class="wheelwrap"><div class="pin">🔻</div><canvas id="wheel" width="340" height="340"></canvas></div><div style="text-align:center"><button class="btn pink" id="spinb">SPIN!</button><div id="wres" class="score" style="margin-top:12px;min-height:30px"></div></div>`);
 const c=$("#wheel"),x=c.getContext("2d"),n=items.length,a=2*Math.PI/n;
 items.forEach((g,i)=>{x.beginPath();x.moveTo(170,170);x.arc(170,170,165,i*a-Math.PI/2,(i+1)*a-Math.PI/2);x.fillStyle=cols[i];x.fill();x.lineWidth=4;x.strokeStyle="#000";x.stroke();x.save();x.translate(170,170);x.rotate(i*a+a/2-Math.PI/2);x.textAlign="right";x.fillStyle="#000";x.font="bold 15px Lexend, sans-serif";x.fillText(g.icon+" "+g.short,155,5);x.restore()});
 let spun=false;$("#spinb").onclick=()=>{if(spun)return;spun=true;const k=rnd(0,n-1);const deg=360*6+(360-(k*360/n+180/n));c.style.transform=`rotate(${deg}deg)`;
  let t=0;const tk=setInterval(()=>{sfx("tick");if(++t>25)clearInterval(tk)},140);

async function loadResp(){const box=$("#resp");if(!box)return;const geos=[S.settings.state,"United States"];
 try{const rows=await Promise.all(geos.map(g=>fetch(`https://data.cdc.gov/resource/rdmq-nq56.json?$limit=8&county=All&geography=${encodeURIComponent(g)}&$order=week_end%20DESC`).then(r=>r.json())));
  box.innerHTML=rows.map((rs,i)=>{const r=rs[0];if(!r)return `<div class="card">No data for ${geos[i]}</div>`;const wk=new Date(r.week_end).toLocaleDateString(undefined,{month:"short",day:"numeric"});
   const cell=(lab,k,tk,col)=>{const tr=ARROW[r[tk]]||[r[tk]||"",'#c9b8ff'];const series=rs.map(x=>+x[k]).reverse();const mx=Math.max(...series,.01);
    return `<div class="stat"><div class="mini">${lab}</div><div class="n" style="color:${col}">${(+r[k]).toFixed(2)}%</div><div class="trend" style="color:${tr[1]}">${tr[0]}</div><svg viewBox="0 0 80 24" width="100%" height="24"><polyline fill="none" stroke="${col}" stroke-width="3" points="${series.map((v,j)=>`${j*80/(series.length-1)},${22-v/mx*20}`).join(" ")}"/></svg></div>`};
   return `<div class="card" style="grid-column:span 1"><h3>${i===0?"🗺️ ":"🇺🇸 "}${geos[i]}</h3><div class="mini" style="margin-bottom:8px">Week ending ${wk}</div><div class="statgrid">${cell("COVID","percent_visits_covid","ed_trends_covid","#00ffa3")}${cell("Flu","percent_visits_influenza","ed_trends_influenza","#7c4dff")}${cell("RSV","percent_visits_rsv","ed_trends_rsv","#b6ff00")}</div></div>`}).join("")+
   `<div class="card"><h3>🏙️ ${esc(S.settings.city)}</h3><p>County-level ED trends are often suppressed. For city data, check your local dashboard:</p>${cityLinks().slice(0,2).map(([n,u])=>`<a class="newsitem" target="_blank" rel="noopener" href="${u}">${n} ↗</a>`).join("")}</div>`;
 }catch(e){box.innerHTML=`<div class="card">Couldn't reach CDC right now (offline?). <a target="_blank" href="https://www.cdc.gov/respiratory-viruses/data/index.html">Open CDC respiratory data ↗</a></div>`}}

 el.innerHTML=j.value.map(v=>`<a class="newsitem ${HOT.test(v.Title)?"hot":""}" target="_blank" rel="noopener" href="https://www.who.int/emergencies/disease-outbreak-news/item/${v.UrlName}"><div class="d">${new Date(v.PublicationDate).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}${HOT.test(v.Title)?" · 🔥 on your watchlist":""}</div><b>${esc(v.Title)}</b></a>`).join("")}catch(e){el.innerHTML=`Couldn't load. <a target="_blank" href="https://www.who.int/emergencies/disease-outbreak-news">Open WHO DON ↗</a>`}}

/* ---------- formula sprint ---------- */
const r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100;
const GEN=[
 ()=>{const n=rnd(60,200),c=rnd(10,n-20);return{q:`${c} of ${n} people at a cookout got sick. Attack rate?`,a:r1(c/n*100),u:"%",w:[r1(n/c),r1(c/(n-c)*100),r1((n-c)/n*100)]}},
 ()=>{const c=rnd(20,120),d=rnd(2,c-5);return{q:`${c} confirmed Ebola cases, ${d} deaths. Case fatality rate?`,a:r1(d/c*100),u:"%",w:[r1(d/(c+d)*100),r1((c-d)/c*100),r1(c/d)]}},
 ()=>{const p=rnd(2,20)*1000,c=rnd(50,900);return{q:`${c} people currently have asthma in a town of ${p.toLocaleString()}. Prevalence per 1,000?`,a:r1(c/p*1000),u:"per 1,000",w:[r1(c/p*100),r1(c/p*10000),r1(p/c)]}},
 ()=>{const py=rnd(10,60)*100,c=rnd(5,40);return{q:`${c} new cases over ${py.toLocaleString()} person-years. Incidence rate per 1,000 PY?`,a:r1(c/py*1000),u:"per 1,000 PY",w:[r1(c/py*100),r1(c/py*10000),r1(py/c)]}},
 ()=>{const a=rnd(20,60),b=rnd(20,80),c=rnd(5,25),d=rnd(60,120);return{q:`Cohort: exposed ${a} sick / ${b} well; unexposed ${c} sick / ${d} well. Risk ratio?`,a:r2((a/(a+b))/(c/(c+d))),u:"",w:[r2(a*d/(b*c)),r2((c/(c+d))/(a/(a+b))),r2(a/c)]}},
 ()=>{const a=rnd(20,60),b=rnd(10,40),c=rnd(10,40),d=rnd(30,80);return{q:`Case-control 2×2: a=${a}, b=${b}, c=${c}, d=${d}. Odds ratio?`,a:r2(a*d/(b*c)),u:"",w:[r2(b*c/(a*d)),r2((a/(a+b))/(c/(c+d))),r2(a*b/(c*d))]}},
 ()=>{const tp=rnd(60,95),fn=rnd(3,30);return{q:`A screening test finds ${tp} true positives and misses ${fn} people with the disease (false negatives). Sensitivity?`,a:r1(tp/(tp+fn)*100),u:"%",w:[r1(fn/(tp+fn)*100),r1(tp/fn*10),r1(100-tp)]}},
 ()=>{const tn=rnd(700,950),fp=rnd(10,120);return{q:`${tn} true negatives and ${fp} false positives. Specificity?`,a:r1(tn/(tn+fp)*100),u:"%",w:[r1(fp/(tn+fp)*100),r1(fp/tn*100),r1(tn/1000*100)]}},
 ()=>{const tp=rnd(40,95),fp=rnd(20,120);return{q:`${tp} true positives, ${fp} false positives. PPV?`,a:r1(tp/(tp+fp)*100),u:"%",w:[r1(fp/(tp+fp)*100),r1(tp/fp*10),r1(tp/(tp+fp+50)*100)]}},
 ()=>{const R=pick([1.5,2,2.5,3,4,5,6,8,10,12,15,18]);return{q:`R0 = ${R}. What % of the population needs immunity for herd immunity?`,a:r1((1-1/R)*100),u:"%",w:[r1(1/R*100),r1(Math.min(99,R*5)),r1((1-1/(R+2))*100)]}},
 ()=>{const u=rnd(10,40),v=r1(rnd(5,u*5)/10);return{q:`Attack rate unvaccinated ${u}%, vaccinated ${v}%. Vaccine efficacy?`,a:r1((u-v)/u*100),u:"%",w:[r1(v/u*100),r1(u-v),r1((u-v)/v*10)]}},
 ()=>{const b=rnd(8,30)*1000,d=rnd(40,250);return{q:`${d} infant deaths and ${b.toLocaleString()} live births. Infant mortality rate per 1,000?`,a:r1(d/b*1000),u:"per 1,000",w:[r1(d/b*100),r1(d/b*100000),r1(b/d/10)]}},
 ()=>{const b=rnd(8,30)*1000,p=Math.round(b*rnd(80,140)/1000);return{q:`${p.toLocaleString()} preterm births out of ${b.toLocaleString()} live births. Preterm birth rate?`,a:r1(p/b*100),u:"%",w:[r1(p/b*1000),r1(p/(b-p)*100+2),r1(b/p)]}},
 ()=>{const c=rnd(15,40),t=c-rnd(3,12);return{q:`Risk with placebo ${c}%, with treatment ${t}%. Number needed to treat?`,a:r1(100/(c-t)),u:"people",w:[r1(c-t),r1(100/c),r1(c/t)]}},
 ()=>{const re=rnd(20,50),ru=rnd(2,15);return{q:`Risk in exposed ${re}%, unexposed ${ru}%. Attributable risk % (among exposed)?`,a:r1((re-ru)/re*100),u:"%",w:[r1(re-ru),r1(ru/re*100),r1((re-ru)/ru*100)]}},
 ()=>{const m=rnd(60,120),sd=rnd(5,20),x=m+sd*pick([-2,-1.5,-1,1,1.5,2,2.5]);return{q:`Mean ${m}, SD ${sd}. Z-score for a value of ${x}?`,a:r2((x-m)/sd),u:"",w:[r2((m-x)/sd),r2((x-m)/(sd*sd)),r2(x/sd)]}},
 ()=>{const e=rnd(40,120),o=e+rnd(-30,60);return{q:`Observed ${o} deaths; ${e} were expected. SMR?`,a:r2(o/e),u:"",w:[r2(e/o),o-e,r2(o/e*100)]}},
 ()=>{const ct=rnd(12,40),c=rnd(2,ct-4);return{q:`Household study: ${c} of ${ct} susceptible contacts got sick. Secondary attack rate?`,a:r1(c/ct*100),u:"%",w:[r1(c/(ct+1)*50),r1((ct-c)/ct*100),r1(ct/c)]}},
 ()=>{const i=rnd(2,15),d=rnd(2,12);return{q:`Incidence ${i} per 1,000/yr, average duration ${d} years. Prevalence per 1,000 ≈ ?`,a:i*d,u:"per 1,000",w:[r1(i/d),i+d,i*d*10]}},
 ()=>{const b=rnd(10,30)*1000,m=rnd(2,12);return{q:`${m} maternal deaths, ${b.toLocaleString()} live births. Maternal mortality ratio per 100,000?`,a:r1(m/b*100000),u:"per 100,000",w:[r1(m/b*1000),r1(m/b*10000),r1(m/b*1000000)]}}
];

const PATHS=[
 {n:"Staphylococcus aureus (toxin)",inc:[1,6],unit:"h",sx:"sudden, intense vomiting and cramps, little or no fever",foods:["Potato salad","Ham sandwiches","Cream puffs"]},
 {n:"Salmonella",inc:[12,60],unit:"h",sx:"diarrhea, fever and stomach cramps",foods:["Chicken","Deviled eggs","Cantaloupe"]},
 {n:"Norovirus",inc:[12,48],unit:"h",sx:"vomiting and watery diarrhea that pass in 1–3 days",foods:["Salad bar greens","Raw oysters","Fruit tray"]},
 {n:"Clostridium perfringens",inc:[6,24],unit:"h",sx:"diarrhea and cramps, usually no vomiting or fever",foods:["Gravy","Roast beef","Chili"]},
 {n:"E. coli O157:H7",inc:[48,168],unit:"h",sx:"severe cramps and bloody diarrhea",foods:["Hamburgers","Romaine salad","Unpasteurized juice"]}
];
const EVENTS=["church anniversary picnic","family reunion cookout","baby shower","block party","school fundraiser dinner","graduation party"];
const SIDES=["Mac & cheese","Collard greens","Cornbread","Fruit punch","Potato chips","Sweet tea","Rolls","Green beans","Cake","Coleslaw"];
function outbreak(){const g=GAMES[1];const P=pick(PATHS),ev=pick(EVENTS),culprit=pick(P.foods);const foods=shuffle([culprit,...shuffle(SIDES).slice(0,5)]);const N=rnd(70,130);
 const people=[...Array(N)].map(()=>{const ate={};foods.forEach(f=>ate[f]=Math.random()<(f===culprit?.6:rnd(35,80)/100));const ill=Math.random()<(ate[culprit]?.72:.06);const on=ill?(P.inc[0]+Math.pow(Math.random(),1.4)*(P.inc[1]-P.inc[0])*.9+Math.random()*(P.inc[1]-P.inc[0])*.1):null;return{ate,ill,on}});
 const ill=people.filter(p=>p.ill);const tab=foods.map(f=>{const e=people.filter(p=>p.ate[f]),u=people.filter(p=>!p.ate[f]);const ei=e.filter(p=>p.ill).length,ui=u.filter(p=>p.ill).length;return{f,ei,en:e.length,ui,un:u.length,are:ei/e.length*100,aru:u.length?ui/u.length*100:0}});
 tab.forEach(t=>t.rr=t.aru?t.are/t.aru:99);const ct=tab.find(t=>t.f===culprit);
 const bins=12,span=P.unit==="h"&&P.inc[1]>100?P.inc[1]:P.inc[1];const w=span/bins;const counts=Array(bins).fill(0);ill.forEach(p=>counts[Math.min(bins-1,Math.floor(p.on/w))]++);const mx=Math.max(...counts);
 const onsets=ill.map(p=>p.on).sort((a,b)=>a-b);const med=onsets[Math.floor(onsets.length/2)];
 let score=0,step=0;const choices=shuffle(PATHS).slice(0,4);if(!choices.includes(P))choices[0]=P;
 const steps=[
  ()=>`<p>📍 After a <b>${ev}</b> with <b>${N}</b> guests, <b>${ill.length}</b> people got sick with <b>${P.sx}</b>. Here's the epi curve (hours after the meal):</p>
   <div class="epibars">${counts.map((c,i)=>`<div title="${Math.round(i*w)}–${Math.round((i+1)*w)}h: ${c}" style="height:${c/mx*100}%;animation-delay:${i*60}ms"></div>`).join("")}</div><div class="row mini" style="justify-content:space-between"><span>0h</span><span>${Math.round(span/2)}h</span><span>${Math.round(span)}h</span></div>
   <p style="margin-top:10px">Median incubation ≈ <b>${Math.round(med)} hours</b>. One sharp peak = a point-source outbreak. <b>Which pathogen fits best?</b></p>
   <div class="opts">${shuffle(choices).map(c=>`<button class="opt" data-a="${c===P?1:0}">${c.n}<br><span class="mini" style="color:#000">${c.inc[0]}–${c.inc[1]}h</span></button>`).join("")}</div>`,
  ()=>`<p>🍽️ You interviewed everyone. Here's the food table. <b>Calculate the attack rate for people who ate the ${tab[0].f}</b> (round to whole %).</p>${foodTable(tab,false)}<div class="row" style="margin-top:10px"><input id="arin" type="number" placeholder="%" style="width:110px"><button class="btn cyan" id="arbtn">Check</button></div><p class="mini">Attack rate = ill ÷ total who ate × 100</p>`,
  ()=>`<p>Now all attack rates are filled in. <b>Which food is the most likely culprit?</b> (Look for: high attack rate among eaters, low among non-eaters, and most sick people ate it.)</p>${foodTable(tab,true)}<div class="opts" style="margin-top:10px">${foods.map(f=>`<button class="opt" data-a="${f===culprit?1:0}">${f}</button>`).join("")}</div>`,
  ()=>{const rr=r1(ct.rr);const o=shuffle([rr,r1(ct.are-ct.aru),r1(ct.aru/ct.are||.1),r1(ct.are/10)]);return `<p>🎯 ${culprit} it is. <b>What is the risk ratio</b> for eating ${culprit}?</p><p class="formula">RR = ${r1(ct.are)}% ÷ ${r1(ct.aru)}%</p><div class="opts">${[...new Set(o)].map(v=>`<button class="opt" data-a="${v===rr?1:0}">${v}</button>`).join("")}</div>`},
  ()=>`<p>📋 Final step. <b>What should the health department do next?</b></p><div class="opts">${shuffle([["Collect leftover food & stool samples for the lab, interview food handlers, and inspect how the food was stored",1],["Close the church permanently",0],[`Post on social media that everyone has ${P.n}`,0],["Wait to see if more people get sick",0]]).map(([t,a])=>`<button class="opt" data-a="${a}">${t}</button>`).join("")}</div>`
 ];
 const render=()=>{modal(headHTML(g,`<span class="chip">Step ${step+1}/5</span><span class="chip score">⭐ ${score}</span>`)+`<div id="ob">${steps[step]()}</div><div id="fbx"></div>`);
  if(step===1){$("#arbtn").onclick=()=>{const v=parseFloat($("#arin").value);const corr=Math.round(tab[0].are);const ok=Math.abs(v-corr)<=1;fin(ok,`${tab[0].ei} ÷ ${tab[0].en} × 100 = <b>${r1(tab[0].are)}%</b>`)}}
  else $$("#ob .opt").forEach(b=>b.onclick=()=>{$$("#ob .opt").forEach(x=>{x.disabled=true;if(x.dataset.a==="1")x.classList.add("right")});const ok=b.dataset.a==="1";if(!ok)b.classList.add("wrong");
   const why=[`${P.n}: incubation ${P.inc[0]}–${P.inc[1]} hours, ${P.sx}.`,"",`${culprit}: attack rate ${r1(ct.are)}% among eaters vs ${r1(ct.aru)}% among non-eaters. ${ct.ei} of ${ill.length} sick people ate it.`,`${r1(ct.are)} ÷ ${r1(ct.aru)} = ${r1(ct.rr)}. People who ate ${culprit} were ${r1(ct.rr)}× as likely to get sick.`,"Lab confirmation + an environmental investigation finds HOW it happened (temperature abuse, cross-contamination, a sick food handler) so you can prevent the next one."][step];fin(ok,why)})};
 const fin=(ok,why)=>{if(ok){score+=100;sfx("right");bump("correct")}else sfx("wrong");$("#fbx").innerHTML=`<div class="fb" style="border-color:${ok?"var(--lime)":"var(--red)"}"><b>${ok?"✅ Nailed it!":"❌ Not quite."}</b> ${why}</div><div style="text-align:right;margin-top:10px"><button class="btn pink" id="nx">${step<4?"Next →":"Close the case 🔒"}</button></div>`;
  $("#nx").onclick=()=>{step++;if(step<5)render();else{if(score>=400)badge("detective");endScreen("outbreak",score,Math.round(score/10)+10,`Case closed: <b>${P.n}</b> in the <b>${culprit}</b>. ${score>=400?"Disease Detective status! 🕵🏾‍♀️":""}`)}}};
 render()}
function foodTable(tab,full){return `<div style="overflow-x:auto"><table class="t"><tr><th rowspan="2">Food</th><th colspan="3">Ate it</th><th colspan="3">Didn't eat</th>${full?'<th rowspan="2">RR</th>':""}</tr><tr><th>Ill</th><th>Total</th><th>AR%</th><th>Ill</th><th>Total</th><th>AR%</th></tr>
 ${tab.map((t,i)=>`<tr><th>${t.f}</th><td>${t.ei}</td><td>${t.en}</td><td>${full?r1(t.are):"?"}</td><td>${t.ui}</td><td>${t.un}</td><td>${full?r1(t.aru):"?"}</td>${full?`<td>${r1(t.rr)}</td>`:""}</tr>`).join("")}</table></div>`}

/* ---------- herd immunity sim ---------- */

 const c=$("#hcan"),x=c.getContext("2d"),W=720,H=380,N=320;let pop=[],running=false,day=0,links=[],hist=[];

 const draw=()=>{x.fillStyle="#0b021c";x.fillRect(0,0,W,H);

  pop.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<6||p.x>W-6)p.vx*=-1;if(p.y<6||p.y>H-56)p.vy*=-1;x.beginPath();x.arc(p.x,p.y,p.s==="I"?6:4.5,0,7);x.fillStyle={S:"#fff",I:"#ff3b3b",R:"#7c4dff",V:"#00e5ff"}[p.s];x.fill();if(p.s==="I"){x.strokeStyle="#ff3b3b55";x.lineWidth=6;x.stroke()}});
  const mx=Math.max(10,...hist);x.fillStyle="#ffffff10";x.fillRect(0,H-50,W,50);hist.forEach((v,i)=>{x.fillStyle="#ff3b3b";const bw=Math.max(2,W/Math.max(60,hist.length));x.fillRect(i*bw,H-v/mx*46,bw-1,v/mx*46)});x.fillStyle="#c9b8ff";x.font="12px Lexend";x.fillText("infected each day",6,H-36)};
 const loop=()=>{draw();GRAF=requestAnimationFrame(loop)};
 const tick=()=>{const d=DZ[$("#hd").value],R=d[1],ve=d[2]/100,D=5;day++;let newI=0;const inf=pop.filter(p=>p.s==="I");
  inf.forEach(p=>{let k=0,lam=R/D,L=Math.exp(-lam),q=1;do{k++;q*=Math.random()}while(q>L);k--;for(let j=0;j<k;j++){const t=pick(pop);if(t===p)continue;if(t.s==="S"||(t.s==="V"&&Math.random()>ve)){t.s="I";t.d=D+1;newI++;links.push({a:p,b:t,t:20})}}});

  const ever=pop.filter(p=>p.s==="I"||p.s==="R").length;$("#hstat").textContent=`Day ${day} · ${ever} ever infected`;
  if(!pop.some(p=>p.s==="I")){clearInterval(ti);running=false;const unv=pop.filter(p=>p.s!=="V").length;const pct=r1(ever/N*100);const stopped=ever<=12;
   if(stopped)badge("herd");$("#hres").innerHTML=`<div class="fb" style="border-color:${stopped?"var(--lime)":"var(--red)"}"><b>${stopped?"🐑 HERD IMMUNITY WINS!":"💥 Outbreak!"}</b> ${ever} of ${N} people (${pct}%) got infected over ${day} days. ${stopped?"The virus couldn't find enough susceptible people.":"Try raising coverage above the threshold and run it again."}</div>`;
   if(!S.day.once_herd){addXPOnce("herd",25)}sfx(stopped?"level":"wrong");if(stopped)confetti(150)}};
 let ti;$("#hgo").onclick=()=>{if(running)return;if(day>0)reset();running=true;const seeds=shuffle(pop.filter(p=>p.s==="S")).slice(0,3);if(seeds.length<3)seeds.push(...shuffle(pop).slice(0,3-seeds.length));seeds.forEach(p=>{p.s="I";p.d=6});ti=setInterval(tick,420);GT.push(ti)};
 $("#hreset").onclick=reset;$("#hc").oninput=()=>{if(!running)reset()};$("#hd").onchange=()=>{if(!running)reset()};reset()}

/* ---------- memory ---------- */
function memory(){const g=GAMES[5];const set=shuffle(VOCAB).slice(0,6);const cards=shuffle(set.flatMap((v,i)=>[{p:i,t:v[0],k:"t"},{p:i,t:v[1],k:"d"}]));let open=[],moves=0,found=0,lock=false;const t0=Date.now();
 modal(headHTML(g,`<span class="chip" id="mv">Moves: 0</span>`)+`<p class="sub">Match each term to its meaning.</p><div class="memgrid">${cards.map((c,i)=>`<div class="flip" data-i="${i}"><div class="in"><div class="f">${["🦠","🧬","💉","🧫","🔬","📊"][i%6]}</div><div class="b" style="${c.k==="t"?"font-family:Bungee;font-size:15px;font-weight:400":""}">${c.t}</div></div></div>`).join("")}</div>`);
 $$(".flip").forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(lock||el.classList.contains("on"))return;el.classList.add("on");sfx("click");open.push([i,el]);
  if(open.length===2){moves++;$("#mv").textContent="Moves: "+moves;const[a,b]=open;open=[];if(cards[a[0]].p===cards[b[0]].p&&cards[a[0]].k!==cards[b[0]].k){found++;sfx("right");bump("correct");a[1].classList.add("gone");b[1].classList.add("gone");if(found===6){badge("memory");const sc=Math.max(10,200-moves*10-Math.round((Date.now()-t0)/2000));const tt=setTimeout(()=>endScreen("memory",sc,30+Math.round(sc/10),`Cleared in ${moves} moves.`),700);GT.push(tt)}}
   else{lock=true;sfx("wrong");const tt=setTimeout(()=>{a[1].classList.remove("on");b[1].classList.remove("on");lock=false},900);GT.push(tt)}}})}

/* ---------- who am i ---------- */
function whoami(){const g=GAMES[4];const rounds=shuffle(WHOAMI).slice(0,6);let r=0,score=0,right=0;
 const show=()=>{if(r>=rounds.length){if(right>=5)badge("whoami");return endScreen("whoami",score,Math.round(score/5)+10,`${right}/${rounds.length} diseases identified.`)}
  const R=rounds[r];let n=1;const opts=shuffle([R.a,...shuffle(WHOAMI.filter(w=>w.a!==R.a)).slice(0,3).map(w=>w.a)]);
  const paint=()=>{modal(headHTML(g,`<span class="chip">${r+1}/${rounds.length}</span><span class="chip score">⭐ ${score}</span>`)+`<div class="qcard">${R.clues.slice(0,n).map((c,i)=>`<div style="margin:6px 0;animation:pop .4s">🔎 <b>Clue ${i+1}:</b> ${c}</div>`).join("")}</div>
   <div class="row" style="margin-bottom:10px"><button class="btn sm violet" id="more" ${n>=R.clues.length?"disabled":""}>➕ Another clue (−10)</button><span class="chip">Worth: ${60-n*10} pts</span></div><div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div><div id="fbx"></div>`);
   $("#more").onclick=()=>{n++;paint()};
   $$(".opt").forEach(b=>b.onclick=()=>{$$(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===R.a)x.classList.add("right")});$("#more").disabled=true;const ok=b.dataset.o===R.a;if(ok){score+=60-n*10;right++;sfx("right");bump("correct")}else{b.classList.add("wrong");sfx("wrong")}
    $("#fbx").innerHTML=`<div class="fb"><b>${ok?"✅ Yes! I'm "+R.a:"❌ I'm "+R.a}</b><br><span class="mini">All clues: ${R.clues.join(" · ")}</span></div><div style="text-align:right;margin-top:10px"><button class="btn pink" id="nx">Next →</button></div>`;$("#nx").onclick=()=>{r++;show()}})};paint()};
 show()}

/* ---------- parent sim ---------- */
function parentSim(){const g=GAMES[3];const sc=shuffle(PARENT_SIMS).slice(0,5);let i=0,trust=50;
 const show=()=>{if(i>=sc.length){if(trust>=130)badge("talker");return endScreen("parent",trust,Math.round(trust/4),trust>=130?"Parents leave your table feeling heard AND informed. 🗣️💜":trust>=90?"Good instincts! Lead with empathy, follow with facts.":"Practice the CASE method in the toolkit, then try again.")}
  const s=sc[i];modal(headHTML(g,`<span class="chip">${i+1}/${sc.length}</span>`)+`<div class="mini">Trust meter</div><div class="meter"><div style="width:${Math.min(100,trust/150*100)}%"></div></div>
  <div class="qcard" style="margin-top:14px">👩🏽‍🍼 <i>"${s.parent}"</i></div><div class="mini" style="margin-bottom:6px">How do you respond?</div>
  <div style="display:grid;gap:10px">${shuffle(s.opts).map(o=>`<button class="opt" style="text-align:left;font-weight:600" data-d="${o[1]}" data-w="${esc(o[2])}">${o[0]}</button>`).join("")}</div><div id="fbx"></div>`);
  $$(".opt").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;trust=Math.max(0,trust+d);$$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.d===20)x.classList.add("right")});if(d<20)b.classList.add("wrong");sfx(d===20?"right":"wrong");if(d===20){bump("correct");bump("myth")}
   $(".meter div").style.width=Math.min(100,trust/150*100)+"%";$("#fbx").innerHTML=`<div class="fb" style="border-color:${d===20?"var(--lime)":"var(--orange)"}"><b>${d>0?"+":""}${d} trust.</b> ${b.dataset.w}</div><div style="text-align:right;margin-top:10px"><button class="btn pink" id="nx">Next parent →</button></div>`;$("#nx").onclick=()=>{i++;show()}})};
 show()}
</script></body></html>
